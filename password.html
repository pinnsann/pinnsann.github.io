<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード生成 | すぐ道具</title>
  <meta name="description" content="長さと文字種を選んで、パスワードを作ります。">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html">すぐ道具</a><nav class="nav" aria-label="主要"><a href="index.html">一覧</a></nav></div></header>
  <main id="main" class="wrap">
    <header class="page-head">
      <p class="kicker">乱数</p>
      <h1>パスワード</h1>
      <p>ブラウザの暗号用乱数で作っています。使う場所に文字数の規則があるなら、それに合わせてください。</p>
    </header>
    <form id="password-form" class="panel">
      <div class="grid-2">
        <label class="field"><span>長さ</span><input name="length" type="number" min="4" max="128" step="1" value="16"></label>
        <label class="field"><span>個数</span><input name="count" type="number" min="1" max="10" step="1" value="1"></label>
      </div>
      <label><input name="lower" type="checkbox" checked> 英小文字</label>
      <label><input name="upper" type="checkbox" checked> 英大文字</label>
      <label><input name="digit" type="checkbox" checked> 数字</label>
      <label><input name="symbol" type="checkbox" checked> 記号</label>
      <label><input name="ambiguous" type="checkbox" checked> 似た文字を除く（0 O o 1 l I）</label>
      <div class="btn-row"><button id="generate" class="btn btn-primary" type="submit">生成する</button></div>
      <p id="password-error" class="warn" role="alert"></p>
      <ul id="password-output" class="password-list" aria-live="polite"></ul>
      <p id="copy-status" role="status"></p>
    </form>
    <p class="related"><a href="invoice.html">請求書</a><a href="counter.html">文字数</a><a href="image.html">画像</a><a href="calendar.html">和暦</a><a href="markdown.html">Markdown</a></p>
  </main>
  <footer class="site-footer"><div class="wrap"><p>処理はこの端末の中だけです。2026-10-12</p></div></footer>
  <script src="js/password.js"></script>
</body>
</html>
