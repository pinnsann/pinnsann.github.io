<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和暦・西暦・年齢 | すぐ道具</title>
  <meta name="description" content="明治以降の和暦と西暦を入れ替え、満年齢を出します。">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html">すぐ道具</a><nav class="nav" aria-label="主要"><a href="index.html">一覧</a></nav></div></header>
  <main id="main" class="wrap">
    <header class="page-head">
      <p class="kicker">日付</p>
      <h1>和暦</h1>
      <p>明治は1868年1月25日から、令和は2019年5月1日から数えています。1年目は元年と出します。年齢は満年齢です。</p>
    </header>
    <div class="layout">
      <section class="panel">
        <h2>西暦から</h2>
        <label class="field"><span>生年月日</span><input id="birth" type="date"></label>
        <label class="field"><span>基準日</span><input id="asof" type="date"></label>
        <p id="cal-out" aria-live="polite">生年月日を入れると、和暦と満年齢を表示します。</p>
      </section>
      <section class="panel">
        <h2>和暦から</h2>
        <label class="field"><span>元号</span>
          <select id="era">
            <option>令和</option>
            <option>平成</option>
            <option>昭和</option>
            <option>大正</option>
            <option>明治</option>
          </select>
        </label>
        <div class="grid-2">
          <label class="field"><span>年</span><input id="era-year" type="number" min="1" max="64" step="1" value="1"></label>
          <label class="field"><span>月</span><input id="era-month" type="number" min="1" max="12" step="1" value="5"></label>
          <label class="field"><span>日</span><input id="era-day" type="number" min="1" max="31" step="1" value="1"></label>
        </div>
        <button id="to-gregorian" class="btn btn-primary" type="button">西暦にする</button>
        <p id="greg-out" aria-live="polite"></p>
      </section>
    </div>
    <p class="related"><a href="invoice.html">請求書</a><a href="counter.html">文字数</a><a href="image.html">画像</a><a href="password.html">パスワード</a><a href="markdown.html">Markdown</a></p>
  </main>
  <footer class="site-footer"><div class="wrap"><p>処理はこの端末の中だけです。2026-10-12</p></div></footer>
  <script src="js/calendar.js"></script>
</body>
</html>
